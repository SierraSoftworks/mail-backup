[package]
name = "mail-backup"
version = "0.1.0"
edition = "2024"
description = "Backup your JMAP mailboxes to a local git repository with daily snapshots."
license = "MIT"
repository = "https://github.com/SierraSoftworks/mail-backup"
homepage = "https://mail-backup.sierrasoftworks.com"

[dependencies]
async-stream = "0.3.6"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "string"] }
croner = "3.0.1"
# The termination feature extends the shutdown handler to SIGTERM/SIGHUP,
# which is how Docker and systemd stop the daemon.
ctrlc = { version = "3.5.2", features = ["termination"] }
# Filter expression DSL used by backup/restore policies. The serde feature
# provides the `Deserialize` impl for `Filter` used in policy configuration.
filt-rs = { version = "1.0.0", features = ["serde"] }
futures = "0.3.31"
gix = { version = "0.85.0", features = ["tree-editor"] }
human-errors = { version = "0.2.3", features = ["pretty"] }
jmap-client = "0.4.1"
pin-project = "1.1.13"
reqwest = { version = "0.12.28", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "stream",
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive", "alloc"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "fs",
  "sync",
  "time",
] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-batteries = { git = "https://github.com/sierrasoftworks/tracing-batteries-rs.git", features = ["opentelemetry", "analytics"] }
unicase = "2.9.0"
unicode-normalization = "0.1.24"
# The serde feature lets monitor endpoints in the config deserialize straight
# into validated `url::Url` values.
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
http = "1.4.1"
rstest = "0.26.1"
tempfile = "3.25.0"
# For the in-process websocket test server (the "net" and "test-util"
# tokio features are likewise test-only); pinned to the version
# jmap-client already uses.
tokio = { version = "1.50.0", features = ["net", "test-util"] }
tokio-tungstenite = "0.29.0"
wiremock = "0.6.2"

[features]
default = []
pure_tests = []

[profile.release]
debug = false
strip = "debuginfo"
